name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Pull to server
    runs-on: self-hosted
    steps:
      - name: Pull latest changes
        run: git -C ${{ vars.DEPLOY_PATH }} pull origin main

      - name: Rebuild and restart
        run: docker compose -f ${{ vars.DEPLOY_PATH }}/docker-compose.yml up -d --build

      - name: Confirm
        run: |
          echo "Deployed at $(date)"
          echo "HEAD: $(git -C ${{ vars.DEPLOY_PATH }} rev-parse --short HEAD)"
