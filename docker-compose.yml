services:
  db:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_DB: pedestrian_safety
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pedestrian_safety"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/pedestrian_safety
    env_file:
      - path: .env
        required: false
    ports:
      - "5001:5000"
    volumes:
      - ./src:/app/src
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
